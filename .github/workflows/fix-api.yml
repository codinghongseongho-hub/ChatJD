name: Apply API-only update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update only API configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          reps = {
              'placeholder="개인 API 키 입력 (미입력 시 자동 연동)"': 'placeholder="개인 API 키 입력"',
              '개인 API 키를 등록하거나, 비워두시면 시스템 자동 연동 키로 동작합니다.': '개인 API 키를 입력하면 해당 키로 Gemini API를 호출합니다.',
              '<p class="text-[11px] text-slate-400">사용자 지정 API 키가 기본 내장되어 있습니다.</p>': '',
              'const USER_PROVIDED_API_KEY = "";': '',
              'apiKey: localStorage.getItem(\'chatjd_apiKey\') || USER_PROVIDED_API_KEY,': 'apiKey: localStorage.getItem(\'chatjd_apiKey\') || \'\',',
              'const activeKey = state.apiKey || USER_PROVIDED_API_KEY;\n            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeKey}`;': 'const activeKey = state.apiKey;\n            if (!activeKey) {\n                throw new Error("설정에서 Gemini API Key를 먼저 입력해 주세요.");\n            }\n            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(activeKey)}`;',
              'const newKey = apiKeyInput.value.trim();\n                state.apiKey = newKey;\n                localStorage.setItem(\'chatjd_apiKey\', newKey);': 'const newKey = apiKeyInput.value.trim();\n                if (!newKey) {\n                    showToast("Gemini API Key를 입력해 주세요.");\n                    return;\n                }\n                state.apiKey = newKey;\n                localStorage.setItem(\'chatjd_apiKey\', newKey);',
          }
          for a,b in reps.items():
              if a not in s and a != '<p class="text-[11px] text-slate-400">사용자 지정 API 키가 기본 내장되어 있습니다.</p>':
                  raise SystemExit(f'Missing expected text: {a[:80]}')
              s = s.replace(a,b)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit API-only change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-api.yml
          git commit -m "Use user-provided Gemini API key only"
          git push