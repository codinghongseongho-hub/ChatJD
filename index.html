<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>챗jd - 맞춤형 게임 추천</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:system-ui,-apple-system,sans-serif}textarea{field-sizing:content}.prose p{margin:.45rem 0}.prose ul{list-style:disc;padding-left:1.3rem}.prose ol{list-style:decimal;padding-left:1.3rem}</style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex">
<aside class="w-72 hidden md:flex flex-col bg-slate-900 border-r border-slate-800 p-4">
  <div class="flex items-center gap-3 mb-5"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-700 flex items-center justify-center">🎮</div><div><div class="font-bold">챗jd</div><div class="text-xs text-slate-400">맞춤형 게임 추천</div></div></div>
  <button id="newChatBtn" class="bg-purple-600 hover:bg-purple-500 rounded-xl py-2.5 font-bold mb-3"><i class="fa-solid fa-plus mr-1"></i>새 추천 받기</button>
  <button id="filterBtn" class="bg-slate-800 hover:bg-slate-700 rounded-xl py-2.5 text-sm mb-4"><i class="fa-solid fa-filter mr-1 text-purple-400"></i>조건 필터</button>
  <div class="text-xs font-semibold text-slate-500 mb-2">대화 기록</div><div id="historyList" class="flex-1 overflow-y-auto space-y-1"></div>
  <div id="status" class="text-xs text-slate-500 mt-3 mb-2">AI 미연결</div>
  <button id="settingsBtn" class="bg-slate-800 hover:bg-slate-700 rounded-xl py-2.5 text-sm"><i class="fa-solid fa-sliders mr-1"></i>설정 및 API</button>
</aside>
<main class="flex-1 flex flex-col min-w-0">
<header class="h-14 border-b border-slate-800 bg-slate-900/90 px-4 flex items-center justify-between"><div class="font-bold">챗jd <span class="text-xs font-normal text-purple-300 bg-purple-950 px-2 py-1 rounded-full">게임 추천</span></div><div class="flex gap-2"><button id="groundingBtn" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs"><i class="fa-solid fa-globe mr-1 text-purple-400"></i><span id="groundingText">구글 검색 OFF</span></button><button id="mobileFilterBtn" class="md:hidden bg-slate-800 px-3 py-2 rounded-lg text-xs">필터</button><button id="mobileSettingsBtn" class="md:hidden bg-slate-800 px-3 py-2 rounded-lg text-xs">설정</button></div></header>
<section id="filterPanel" class="hidden border-b border-slate-800 bg-slate-900 p-4"><div class="max-w-4xl mx-auto grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 text-xs">
<div><label class="block text-slate-400 mb-1">플랫폼</label><select id="fPlatform" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2"><option>전체</option><option>PC</option><option>PlayStation</option><option>Nintendo Switch</option><option>Xbox</option><option>Mobile</option></select></div>
<div><label class="block text-slate-400 mb-1">장르</label><select id="fGenre" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2"><option>상관없음</option><option>액션 / RPG</option><option>오픈월드 / 어드벤처</option><option>전략 / 시뮬레이션</option><option>FPS / TPS</option><option>공포 / 스릴러</option><option>인디</option><option>퍼즐 / 캐주얼</option></select></div>
<div><label class="block text-slate-400 mb-1">최소 메타</label><select id="fMeta" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2"><option>무관</option><option>90+</option><option>85+</option><option>80+</option><option>75+</option></select></div>
<div><label class="block text-slate-400 mb-1">유저 평점</label><select id="fUser" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2"><option>무관</option><option>95%+</option><option>90%+</option><option>80%+</option></select></div>
<div><label class="block text-slate-400 mb-1">이용 등급</label><select id="fAge" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2"><option>무관</option><option>전체이용가</option><option>12세 / 15세</option><option>18세+</option></select></div>
<div><label class="block text-slate-400 mb-1">플레이</label><select id="fPlay" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2"><option>상관없음</option><option>싱글</option><option>2인 Co-op</option><option>멀티 / PVP</option></select></div>
<div class="col-span-2 sm:col-span-3 lg:col-span-6 flex justify-end"><button id="applyFilterBtn" class="bg-purple-600 hover:bg-purple-500 rounded-lg px-4 py-2 font-bold">이 조건으로 추천</button></div>
</div></section>
<div id="chat" class="flex-1 overflow-y-auto p-4 sm:p-6"><div id="welcome" class="max-w-2xl mx-auto text-center py-14"><div class="text-5xl mb-5">🎮</div><h1 class="text-2xl sm:text-3xl font-extrabold mb-3">취향에 딱 맞는 <span class="text-purple-400">챗jd</span></h1><p class="text-slate-400 mb-6">먼저 설정에서 API 키와 모델을 직접 입력하세요.<br>기본으로 연결된 AI나 API 키는 없습니다.</p><div class="grid sm:grid-cols-2 gap-3 text-left"><button class="quick p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-purple-500/50">PC 인디 명작<br><span class="text-xs text-slate-400">메타 85+ / 스팀 95%+</span></button><button class="quick p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-purple-500/50">2인 협동 게임<br><span class="text-xs text-slate-400">PS5 / Xbox / Co-op</span></button></div></div><div id="messages" class="max-w-3xl mx-auto space-y-5"></div></div>
<footer class="border-t border-slate-800 bg-slate-950 p-3 sm:p-4"><form id="chatForm" class="max-w-3xl mx-auto flex gap-2"><textarea id="input" rows="1" required placeholder="원하는 게임 조건을 입력하세요..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl p-3 resize-none focus:outline-none focus:border-purple-500"></textarea><button id="send" class="bg-purple-600 hover:bg-purple-500 rounded-xl px-4" title="전송"><i class="fa-solid fa-paper-plane"></i></button></form></footer>
</main>
<div id="settingsModal" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-4"><div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl p-5 space-y-4">
<div class="flex justify-between items-center"><h2 class="font-bold">AI 연결 설정</h2><button id="closeSettings">×</button></div>
<div class="text-xs text-slate-400">처음에는 AI와 API가 연결되지 않습니다. 아래 정보를 저장한 뒤에만 AI를 호출합니다.</div>
<div><label class="text-xs text-slate-300">API 키</label><input id="apiKey" type="password" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3" placeholder="API 키 입력"></div>
<div><label class="text-xs text-slate-300">모델 이름</label><input id="model" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3" placeholder="예: gemini-2.5-flash"></div>
<div><label class="text-xs text-slate-300">시스템 지시문</label><textarea id="systemPrompt" rows="4" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3">당신은 게임 추천 전문가입니다. 사용자의 조건을 우선하여 정확하고 유용한 게임을 추천하세요.</textarea></div>
<div class="flex justify-between"><button id="clearAI" class="bg-slate-800 px-4 py-2 rounded-lg text-sm">연결 정보 삭제</button><button id="saveAI" class="bg-purple-600 px-4 py-2 rounded-lg font-bold text-sm">저장</button></div>
</div></div>
<script>
const SETTINGS='chatjd_ai_settings_v2', CHATS='chatjd_chats_v2';
let settings=JSON.parse(localStorage.getItem(SETTINGS)||'null')||{apiKey:'',model:'',systemPrompt:'당신은 게임 추천 전문가입니다. 사용자의 조건을 우선하여 정확하고 유용한 게임을 추천하세요.'};
let chats=JSON.parse(localStorage.getItem(CHATS)||'{}'), currentId=Date.now().toString(), useGrounding=false;
const $=id=>document.getElementById(id), chat=$('chat'), messages=$('messages'), welcome=$('welcome');
function save(){localStorage.setItem(CHATS,JSON.stringify(chats));renderHistory()}
function current(){if(!chats[currentId])chats[currentId]={title:'새 게임 추천',time:Date.now(),messages:[]};return chats[currentId]}
function renderHistory(){const box=$('historyList');box.innerHTML='';Object.entries(chats).sort((a,b)=>b[1].time-a[1].time).forEach(([id,c])=>{const row=document.createElement('div');row.className='flex items-center gap-1';const btn=document.createElement('button');btn.className='flex-1 text-left text-xs p-2 rounded-lg '+(id===currentId?'bg-purple-950 text-purple-300':'hover:bg-slate-800');btn.textContent=c.title||'게임 추천';btn.onclick=()=>switchChat(id);const del=document.createElement('button');del.className='text-slate-500 hover:text-rose-400 p-2';del.innerHTML='<i class="fa-solid fa-trash text-[10px]"></i>';del.onclick=e=>{e.stopPropagation();delete chats[id];if(id===currentId)startNew();save()};row.append(btn,del);box.appendChild(row)})}
function switchChat(id){currentId=id;messages.innerHTML='';const c=current();welcome.classList.toggle('hidden',c.messages.length>0);c.messages.forEach(m=>bubble(m.role,m.content));renderHistory()}
function startNew(){currentId=Date.now().toString();messages.innerHTML='';welcome.classList.remove('hidden');renderHistory()}
function bubble(role,text){const d=document.createElement('div');d.className='flex '+(role==='user'?'justify-end':'justify-start');const b=document.createElement('div');b.className='max-w-[90%] rounded-2xl p-4 '+(role==='user'?'bg-purple-600':'bg-slate-900 border border-slate-800');if(role==='model'){b.className+=' prose prose-invert';b.innerHTML=marked.parse(text)}else b.textContent=text;d.appendChild(b);messages.appendChild(d);chat.scrollTop=chat.scrollHeight;return b}
function status(){ $('status').textContent=settings.apiKey&&settings.model?'AI 연결 설정됨':'AI 미연결';}
function updateGrounding(){const b=$('groundingBtn'),t=$('groundingText');t.textContent=useGrounding?'구글 검색 ON':'구글 검색 OFF';b.className='px-3 py-2 rounded-lg text-xs '+(useGrounding?'bg-purple-700 text-white':'bg-slate-800 hover:bg-slate-700');}
function openSettings(){$('apiKey').value=settings.apiKey||'';$('model').value=settings.model||'';$('systemPrompt').value=settings.systemPrompt||'';$('settingsModal').classList.remove('hidden');$('settingsModal').classList.add('flex')}
function closeSettings(){$('settingsModal').classList.add('hidden');$('settingsModal').classList.remove('flex')}
function quickPrompt(text){$('input').value=text;$('chatForm').requestSubmit()}
$('settingsBtn').onclick=openSettings;$('mobileSettingsBtn').onclick=openSettings;$('closeSettings').onclick=closeSettings;
$('saveAI').onclick=()=>{const key=$('apiKey').value.trim(),model=$('model').value.trim();if(!key||!model){alert('API 키와 모델 이름을 모두 입력하세요.');return}settings={apiKey:key,model,systemPrompt:$('systemPrompt').value.trim()};localStorage.setItem(SETTINGS,JSON.stringify(settings));status();closeSettings()};
$('clearAI').onclick=()=>{settings={apiKey:'',model:'',systemPrompt:'당신은 게임 추천 전문가입니다. 사용자의 조건을 우선하여 정확하고 유용한 게임을 추천하세요.'};localStorage.removeItem(SETTINGS);$('apiKey').value='';$('model').value='';status()};
$('newChatBtn').onclick=startNew;$('filterBtn').onclick=()=>{$('filterPanel').classList.toggle('hidden')};$('mobileFilterBtn').onclick=()=>{$('filterPanel').classList.toggle('hidden')};
$('groundingBtn').onclick=()=>{useGrounding=!useGrounding;updateGrounding()};
$('applyFilterBtn').onclick=()=>{const p=$('fPlatform').value,g=$('fGenre').value,m=$('fMeta').value,u=$('fUser').value,a=$('fAge').value,pl=$('fPlay').value;quickPrompt(`다음 조건을 모두 고려해서 게임을 추천해줘. 플랫폼: ${p}, 장르: ${g}, Metacritic 최소 점수: ${m}, 유저 평점: ${u}, 이용 등급: ${a}, 플레이 방식: ${pl}. 최신 정보가 필요하면 가능한 범위에서 확인하고, 조건에 맞는 게임을 3~5개 추천해줘.`)};
document.querySelectorAll('.quick').forEach(x=>x.onclick=()=>quickPrompt(x.innerText.replace(/\n/g,' / ')+' 추천해줘.'));
async function ask(text){if(!settings.apiKey||!settings.model){openSettings();throw new Error('설정에서 API 키와 모델을 먼저 입력하세요.')}const c=current();const contents=c.messages.map(m=>({role:m.role,parts:[{text:m.content}]}));contents.push({role:'user',parts:[{text}]});const payload={contents,systemInstruction:{parts:[{text:settings.systemPrompt}]}};if(useGrounding)payload.tools=[{google_search:{}}];const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model)}:generateContent?key=${encodeURIComponent(settings.apiKey)}`;const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.error?.message||`HTTP ${r.status}`);const out=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('');if(!out)throw new Error('AI 응답이 비어 있습니다.');c.messages.push({role:'user',content:text},{role:'model',content:out});if(c.messages.length===2)c.title=text.length>22?text.slice(0,22)+'...':text;save();return out}
$('chatForm').onsubmit=async e=>{e.preventDefault();const input=$('input'),text=input.value.trim();if(!text)return;input.value='';bubble('user',text);const loading=bubble('model','응답 생성 중...');$('send').disabled=true;try{loading.innerHTML=marked.parse(await ask(text))}catch(err){loading.innerHTML=marked.parse('⚠️ '+err.message)}finally{$('send').disabled=false}};
status();renderHistory();updateGrounding();
</script>
</body></html>
